services:
  - type: web
    name: habitpet-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard - it's a secret
      - key: PORT
        value: "8080"
      - key: PUSH_PROVIDER
        value: fcm
      - key: FCM_PROJECT_ID
        value: habitpet-d53d3
      - key: FCM_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/fcm-service-account.json
        # The file itself is a Render "Secret File" (Environment tab -> Secret
        # Files), not a plain env var - it's the private key that lets the
        # backend send pushes and must never go in git (see docs/PUSH_SETUP.md).
      # MAIL_PROVIDER defaults to "none" (password-reset and email-verification
      # requests are accepted but no mail goes out) until RESEND_API_KEY +
      # MAIL_FROM are supplied - see backend/README.md's "Password reset &
      # email verification" section. Add those two keys here and set
      # MAIL_PROVIDER=resend to turn it on.
      # CORS_ALLOWED_ORIGINS is only needed if a browser-based client (a
      # Flutter web build, a staging dashboard) is ever added; the mobile app
      # itself sends no Origin header and is unaffected either way.
    healthCheckPath: /api/health
